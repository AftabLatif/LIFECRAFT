name: Add index.wasm from release
on:
  workflow_dispatch:
jobs:
  add-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download index.wasm from release v0.1
        run: curl -L -o index.wasm https://github.com/AftabLatif/LIFECRAFT/releases/download/v0.1/index.wasm
      - name: Commit index.wasm
        run: |
          ls -l index.wasm
          sha256sum index.wasm
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.wasm
          git commit -m "LIFECRAFT v0.1 web export"
          git push
